[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "piano-transcription-lab"
version = "0.1.0"
description = "Local CLI prototype for converting piano-focused audio into MIDI, MusicXML, and PDF sheet music."
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
runtime = ["music21>=9", "mido>=1.3"]
piano = ["piano-transcription-inference>=0.0.6", "librosa>=0.10"]

[project.scripts]
piano-transcribe = "piano_transcription_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
